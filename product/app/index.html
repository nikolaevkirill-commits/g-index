<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07131a">
  <meta name="description" content="Calm cosmic timing with transparent sources, sky context and Jyotish.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="https://nikolaevkirill-commits.github.io/g-index/icon192.png">
  <title>NeboRhythm mobile shell</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><strong>NeboRhythm</strong><small id="location">Kyiv · UTC+3</small></div>
      <div class="top-actions"><button type="button" id="mode" aria-pressed="false">Великий текст</button><select id="locale" aria-label="Мова"><option value="uk">UK</option><option value="en">EN</option><option value="es">ES</option></select></div>
    </header>
    <main id="content" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Основна навігація">
      <button type="button" data-route="today" aria-current="page">Сьогодні</button>
      <button type="button" data-route="timeline">Час</button>
      <button type="button" data-route="sky">Небо</button>
      <button type="button" data-route="jyotish">Jyotish</button>
      <button type="button" data-route="you">Ви</button>
    </nav>
  </div>
  <script src="app.js" defer></script>
  <script>document.documentElement.dataset.pwaState='unsupported';if('serviceWorker' in navigator&&location.protocol.startsWith('http')){document.documentElement.dataset.pwaState='registering';addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(()=>document.documentElement.dataset.pwaState='registered').catch(()=>document.documentElement.dataset.pwaState='failed'))}</script>
</body>
</html>
