# G-Index — GitHub Pages config (root repo)
# Pages source: main branch, folder /deploy
# URL: https://nikolaevkirill-commits.github.io/g-index/deploy/

title: "G-Index: Space & Stars"
description: "Explainable daily signal: space weather + calendar intelligence."

url: "https://nikolaevkirill-commits.github.io"
baseurl: "/g-index/deploy"

markdown: kramdown

include:
  - index.html
  - manifest.json
  - sw.js
  - icon192.png
  - icon512.png

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - yarn.lock
  - vendor
  - .gitignore
  - .DS_Store
  - "*.py"
  - "*.csv"
  - "*.xlsx"
  - "*.pdf"
  - deploy/
