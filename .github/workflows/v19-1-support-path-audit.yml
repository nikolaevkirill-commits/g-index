name: v19.1 support-path audit

on:
  push:
    branches: [fix/post-freeze-engine-correctness]
    paths:
      - 'audit_v19_1_support_path_parity.py'
      - 'score_engine_v19_preview.py'
      - 'deploy/score_engine_v19_preview.py'
      - 'deploy/panchanga_sign_priors.json'
      - 'deploy/calendar_tags_2025_2026.json'
      - 'tests/test_v19_1_deploy_support.py'
      - '.github/workflows/v19-1-support-path-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit root vs deploy support resolution
        run: python audit_v19_1_support_path_parity.py
      - name: Deploy-context support-aware tests
        run: python -m unittest tests.test_v19_1_deploy_support -v
