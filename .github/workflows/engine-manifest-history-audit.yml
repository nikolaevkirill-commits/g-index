name: engine manifest history audit

on:
  push:
    branches: [fix/post-freeze-engine-correctness]
    paths:
      - 'audit_engine_manifest_history.py'
      - '.github/workflows/engine-manifest-history-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python audit_engine_manifest_history.py
