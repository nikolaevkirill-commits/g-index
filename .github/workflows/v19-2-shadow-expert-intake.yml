name: v19.2 shadow expert intake

on:
  push:
    branches:
      - fix/post-freeze-engine-correctness
    paths:
      - 'expert_overrides_v3.json'
      - 'deploy/expert_overrides_v3.json'
      - 'ingest_v19_2_shadow_expert_pdf.py'
      - 'append_v19_2_shadow_observation.py'
      - 'tests/test_v19_2_shadow_expert_intake.py'
      - '.github/workflows/v19-2-shadow-expert-intake.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-freeze-engine-correctness
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify leakage guard semantics
        run: python -m unittest tests.test_v19_2_shadow_expert_intake -v
      - name: Run leakage-safe verified-PDF intake
        run: python ingest_v19_2_shadow_expert_pdf.py
      - name: Verify shadow remains non-production
        run: |
          python - <<'PY'
          import json
          s=json.load(open('V19_2_PROSPECTIVE_SHADOW_STATUS_v1.json',encoding='utf-8'))
          assert s['production_formula_changed'] is False
          assert s['promotion_allowed'] is False
          assert s['state']=='FROZEN_PROSPECTIVE_SHADOW'
          print('shadow safety assertions PASS')
          PY
      - name: Commit append-only observations if any
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f V19_2_PROSPECTIVE_SHADOW_OBSERVATIONS_v1.json && git add V19_2_PROSPECTIVE_SHADOW_OBSERVATIONS_v1.json || true
          git add V19_2_PROSPECTIVE_SHADOW_STATUS_v1.json
          if git diff --cached --quiet; then
            echo 'No prospective expert/PDF observations to commit.'
            exit 0
          fi
          git commit -m 'data(engine): append prospective v19.2 expert observation'
          git push origin HEAD:fix/post-freeze-engine-correctness
