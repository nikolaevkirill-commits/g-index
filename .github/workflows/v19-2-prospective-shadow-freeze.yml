name: v19.2 prospective shadow freeze

on:
  push:
    branches: [fix/post-freeze-engine-correctness]
    paths:
      - 'freeze_v19_2_prospective_shadow.py'
      - 'ENGINE_V19_2_EXPOSED_RULE_ATTRIBUTION.json'
      - 'ENGINE_V19_2_PRODUCTION_HIERARCHY_IMPACT.json'
      - 'engine_scores_v19_2_candidate.json'
      - '.github/workflows/v19-2-prospective-shadow-freeze.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-freeze-engine-correctness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze prospective cohort
        run: python freeze_v19_2_prospective_shadow.py
      - name: Safety assertions
        run: |
          python - <<'PY'
          import json
          d=json.load(open('V19_2_PROSPECTIVE_SHADOW_FREEZE_v1.json',encoding='utf-8'))
          assert d['production_changed'] is False
          assert d['promotion_allowed'] is False
          assert d['direct_promotion_gate'] == 'HOLD'
          assert d['counts']['rows'] == 29
          assert d['counts']['sign_flips'] == 12
          assert all(r['evaluation_status']=='pending' for r in d['rows'])
          assert all(r['future_expert_label'] is None for r in d['rows'])
          assert all(r['future_real_outcome'] is None for r in d['rows'])
          print('prospective shadow safety PASS')
          PY
      - name: Commit frozen shadow artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V19_2_PROSPECTIVE_SHADOW_FREEZE_v1.json V19_2_PROSPECTIVE_SHADOW_STATUS_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(engine): freeze v19.2 prospective shadow cohort'
          git push origin HEAD:fix/post-freeze-engine-correctness
