name: FP577 tablet focus
on:
  push:
    branches: [codex/fp577-tablet-diagnostic-969de3b]
permissions:
  contents: read
jobs:
  reflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 969de3b55220345efbe102f2609af95ff16cad41
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "969de3b55220345efbe102f2609af95ff16cad41"
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: |
          echo  | base64 -d > "$RUNNER_TEMP/Tablet.cjs"
          NODE_PATH="$PWD/node_modules" node "$RUNNER_TEMP/Tablet.cjs" "$PWD"
