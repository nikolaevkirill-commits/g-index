name: apply root UI regression repair

on:
  push:
    branches: [fix/root-ui-regression-guard]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/root-ui-regression-guard
          fetch-depth: 0
      - name: Apply prepared repair
        run: python tmp_apply_root_ui_fix.py
      - name: Verify repaired package
        run: |
          set -euo pipefail
          python verify_production_release_guard.py
          node --check engine_tag_parser.js
          node --check sw.js
          python -m py_compile deploy/run_forecast.py deploy/generate_forecast_pdf.py deploy/generate_bulletin.py verify_production_release_guard.py
          git diff --check
          git diff --stat
      - name: Commit isolated product repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html daily_chain.bat
          if git diff --cached --quiet; then
            echo 'No product patch required.'
            exit 0
          fi
          git commit -m 'fix(runtime): restore root UI contract and block local rollback'
          git push origin HEAD:fix/root-ui-regression-guard
