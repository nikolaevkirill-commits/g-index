name: FP577 tablet reflow
on:
  push:
    branches: [codex/fp577-reflow-66a58f1]
permissions:
  contents: read
jobs:
  reflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 66a58f1b691603be2c9898903e5a0664f7263cb3
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "66a58f1b691603be2c9898903e5a0664f7263cb3"
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/public/verify_all_routes_reflow.cjs . "$RUNNER_TEMP/reflow.json"
