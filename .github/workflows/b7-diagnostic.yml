name: FP575 publication dependency control
on: workflow_dispatch
permissions:
  contents: read
jobs:
  accepted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 023723bb5621c7e75c9622a3d74602baa4fc7217
          persist-credentials: false
      - name: Verify candidate and native dependency
        run: |
          test "$(git rev-parse HEAD)" = 023723bb5621c7e75c9622a3d74602baa4fc7217
          python - <<'PY'
          from pathlib import Path
          import re
          native = Path('.github/workflows/gated-pages.yml').read_text()
          assert re.search(r'^  deploy:\n    needs: checks\n    if: github.ref ==',native,re.M)
          assert native.index('name: Negative gate probe') < native.index('run: python tools/public/build_pages.py') < native.index('uses: actions/upload-pages-artifact')
          PY
  rejected:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 023723bb5621c7e75c9622a3d74602baa4fc7217
          persist-credentials: false
      - name: Run native negative assertion from candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, shlex
          native = Path('.github/workflows/gated-pages.yml').read_text()
          body = native.split('- name: Negative gate probe',1)[1].split('run: |',1)[1].strip().splitlines()[0]
          args = shlex.split(body)
          assert args[:2] == ['node','-e'] and 'Intentional gate probe' in args[2]
          raise SystemExit(subprocess.run(args,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode)
          PY
      - name: Build marker after failure
        run: echo build-was-reached
  allowed_downstream:
    needs: accepted
    runs-on: ubuntu-24.04
    steps:
      - run: echo reached
  blocked_downstream:
    needs: rejected
    runs-on: ubuntu-24.04
    steps:
      - run: echo reached
