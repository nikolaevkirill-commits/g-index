name: Source transport diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Probe official sources with curl default and IPv4
        shell: bash
        run: |
          mkdir -p evidence
          probe() {
            name="$1"; mode="$2"; url="$3"
            set +e
            curl $mode --location --connect-timeout 8 --max-time 20 --silent --show-error --output "evidence/$name.body" --write-out 'http=%{http_code} remote=%{remote_ip} size=%{size_download} dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total}\n' "$url" > "evidence/$name.status" 2> "evidence/$name.error"
            echo "exit=$?" >> "evidence/$name.status"
            cat "evidence/$name.status" "evidence/$name.error"
          }
          probe fred_default '' 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS&cosd=2026-07-07&coed=2026-11-03'
          probe fred_ipv4 '-4' 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=VIXCLS&cosd=2026-07-07&coed=2026-11-03'
          probe fred_table '-4' 'https://fred.stlouisfed.org/data/VIXCLS'
          probe cboe '-4' 'https://cdn-api.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-transport
          path: evidence/
          retention-days: 7
