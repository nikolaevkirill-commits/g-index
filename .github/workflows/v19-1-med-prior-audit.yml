name: v19.1 med-prior precedence audit

on:
  push:
    branches: [fix/post-freeze-engine-correctness]
    paths:
      - 'audit_v19_1_med_prior_precedence.py'
      - 'score_engine_v19_preview.py'
      - 'forecast_engine_v17_0.py'
      - 'engine_scores.json'
      - 'deploy/engine_scores.json'
      - 'deploy/panchanga_sign_priors.json'
      - 'deploy/calendar_tags_2025_2026.json'
      - 'V19_2_PROSPECTIVE_SHADOW_FREEZE_v1.json'
      - '.github/workflows/v19-1-med-prior-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify recovered v17 source
        run: echo '1b4c5fa7052590ed441923e9383f42654247711c5ece6f9cea765693a954eaae  forecast_engine_v17_0.py' | sha256sum -c -
      - name: Run semantic audit
        run: python audit_v19_1_med_prior_precedence.py
      - name: Verify reproducibility
        run: |
          git diff --exit-code -- ENGINE_V19_1_MED_PRIOR_PRECEDENCE_AUDIT.json
          python - <<'PY'
          import json
          d=json.load(open('ENGINE_V19_1_MED_PRIOR_PRECEDENCE_AUDIT.json',encoding='utf-8'))
          assert d['counts']['rows_where_source_order_differs_from_documented_med_first']==2
          assert d['counts']['conflicts_in_frozen_29_cohort']==0
          print('med-prior audit reproducibility PASS')
          PY
