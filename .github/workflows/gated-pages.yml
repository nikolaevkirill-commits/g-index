name: gated Pages
on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      failure_probe:
        description: Deliberately fail a test to prove deployment is blocked
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_sha:
        type: string
        required: true
      watchdog_nonce:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: pages-release
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # REL-1: a feed-only refresh must not depend on browser UI gates (B7 flakiness), but it may
      # skip them only when every file changed since the LAST SUCCESSFULLY GATED deploy is under
      # forecast.json or NOAA receipts. Registry/runtime changes and unknown evidence run the full gate.
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow gated-pages.yml --branch deploy --status success --limit 20 --json headSha,conclusion --jq '[.[]|select(.conclusion=="success")][0].headSha' 2>/dev/null || true)
          python tools/public/release_scope.py --baseline "${last:-}" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/public/verify_boundary.py
      - run: python tools/public/sync_inline_styles.py
      - run: python tools/cloud/test_publication_paths.py
      - run: python tools/cloud/test_public_feed.py
      - run: python -m pip install pyswisseph==2.10.3.2
      - run: python tools/cloud/test_expert_model.py
      - run: python tools/cloud/test_calendar_components.py
      - run: python tools/cloud/test_sunrise_conventions.py
      - run: python tools/cloud/test_transit_events.py
      - run: python tools/cloud/test_space_weather.py
      - run: python tools/cloud/test_reconciled_inputs.py
      - run: python tools/cloud/test_market_proxy.py
      - run: python tools/public/test_release_publication.py
      - run: python tools/public/test_release_scope.py
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/test_browser_readiness.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_day_cautions.cjs
      - run: node tools/public/verify_noaa_missing.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_svg_missing.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_presentation.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_day_summary.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_journal_restore_time.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_journal_restore_adversarial.cjs
      # The real update button is gated; trace/restart and direct-message probes remain diagnostics.
      # B7 (audit FP549): the release gate exercises the production update path (#pwaUpdateBar button ->
      # pwaReload). The direct postMessage trigger bypasses pwaReload and stays a diagnostic in b7-diagnostic.yml.
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/test_sw_update_coordination.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_css_upgrade.cjs --button
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_b7_activation_race.cjs 20 classic.html
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_b7_activation_race.cjs 20 index.html
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_b7_activation_race.cjs 5 classic.html --multi
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_b7_activation_race.cjs 5 index.html --multi
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.mode != 'data'
        with:
          name: css-upgrade-evidence
          path: /tmp/skyrhythm-css-upgrade-*/
          if-no-files-found: ignore
          retention-days: 14
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_civil_time.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/test_locale_fp542.cjs
      - run: node tools/public/test_authority_fp542.cjs
      - run: node tools/public/test_scoped_decisions.cjs
      - run: node tools/public/test_expert_refresh_regression.cjs
      - run: node tools/public/verify_authority_fp542.cjs
      - run: node tools/public/verify_final_score.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_expert_november.cjs
      - run: node tools/public/test_notification_locale.cjs
      - run: node tools/public/verify_entry_score_equivalence.cjs
      - run: node tools/public/verify_authority_boundary.cjs
      - run: node tools/public/verify_fork_drift.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_l10n_expanded.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_sky_scene.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_day_verdict.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_day_match.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_natal_sky.cjs --slow-render
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_notification_navigation.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_panchanga_cache.cjs cache-regression
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_text_reflow.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_all_routes_reflow.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_no_overlap.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_calendar_selection.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_day_context.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_day_context_guards.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_sky_live.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_sky_live_guards.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_moon_gl.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_moon_gl_integration.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_motion_settings.cjs

      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/verify_first_screen_order.cjs
      - run: node tools/public/check_final_score_v113.cjs . final-score-regression.json
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/check_legacy_sync_v112.cjs . legacy-regression.json
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/check_product_brand_v123.cjs
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/science_festival_engine.cjs festival-unit
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/science_festival_ui.cjs festival-ui
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/science_festival_offline.cjs festival-offline
      - if: steps.scope.outputs.mode != 'data'
        run: node tools/public/science_festival_library.cjs
      - name: Negative gate probe
        if: github.event_name == 'workflow_dispatch' && inputs.failure_probe
        run: |
          node -e "require('node:assert/strict').equal(0,-2,'Intentional gate probe: mismatched scores must block deployment')"
      - run: python tools/public/build_pages.py
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ needs.checks.outputs.sha }}'}
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify published runtime and decisions
        run: python tools/public/verify_release_publication.py
      - name: Verify published feed
        env:
          PUBLIC_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          WATCHDOG_NONCE: ${{ inputs.watchdog_nonce }}
        run: python tools/cloud/verify_publication.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-publication-evidence
          path: |
            cloud-publication.json
            release-publication.json
          retention-days: 14
