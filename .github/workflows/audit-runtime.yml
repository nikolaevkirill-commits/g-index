name: audit runtime regressions
on:
  pull_request:
    paths: ['index.html', 'sw.js', 'runtime_diagnostics_v1.js', 'push_client_v1.js', 'privacy_accessibility_v1.js', 'notification_runtime_v1.js', 'lifecycle_refresh_v1.js', 'presentation_runtime_v1.js', 'product_render_queue_v1.js', 'local_storage_v1.js', 'consumer_authority_v1.js', 'consumer_overview_v1.js', 'consumer_overview_v1.css', 'calendar_context_v1.js', 'play_channel.js', '*xlsx*.js', 'privacy.html', 'terms.html', 'account-deletion.html', 'tools/kp_alert_bot.py', 'outcome_score_contract.py', 'pair_tanita_real_outcomes.py', 'outcome_ledger_audit.py', 'import_validated_outcome_queue.py', 'validate_outcome_intake_queue.py', 'tests/audit_runtime/**', '.github/workflows/audit-runtime.yml']
  push:
    branches: [deploy]
    paths: ['index.html', 'sw.js', 'runtime_diagnostics_v1.js', 'push_client_v1.js', 'privacy_accessibility_v1.js', 'notification_runtime_v1.js', 'lifecycle_refresh_v1.js', 'presentation_runtime_v1.js', 'product_render_queue_v1.js', 'local_storage_v1.js', 'consumer_authority_v1.js', 'consumer_overview_v1.js', 'consumer_overview_v1.css', 'calendar_context_v1.js', 'play_channel.js', '*xlsx*.js', 'privacy.html', 'terms.html', 'account-deletion.html', 'tools/kp_alert_bot.py', 'outcome_score_contract.py', 'pair_tanita_real_outcomes.py', 'outcome_ledger_audit.py', 'import_validated_outcome_queue.py', 'validate_outcome_intake_queue.py', 'tests/audit_runtime/**', '.github/workflows/audit-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/audit_runtime/verify_decision_log.cjs
      - run: node tests/audit_runtime/verify_formula_inputs.cjs
      - run: node tests/audit_runtime/verify_noaa_parser.cjs
      - run: node tests/audit_runtime/verify_retro.cjs
      - run: node tests/audit_runtime/verify_calendar_context.cjs
      - run: node tests/audit_runtime/verify_excel_inputs.cjs
      - run: node tests/audit_runtime/verify_uaf_input.cjs
      - run: node tests/audit_runtime/verify_noaa_parser_browser.cjs
      - run: node tests/audit_runtime/verify_formula_sync.cjs
      - run: node tests/audit_runtime/verify_scientific.cjs
      - run: node tests/audit_runtime/verify_channel.cjs
      - run: node tests/audit_runtime/verify_play_source_privacy.cjs
      - run: node tests/audit_runtime/verify_runtime.cjs
      - run: node tests/audit_runtime/verify_accessibility.cjs
      - run: node tests/audit_runtime/verify_followup.cjs
      - run: node tests/audit_runtime/verify_sw_browser.cjs
      - run: node tests/audit_runtime/verify_runtime_hygiene.cjs
      - run: node tests/audit_runtime/verify_presentation.cjs
      - run: node tests/audit_runtime/verify_independent_panel.cjs
      - run: node tests/audit_runtime/verify_consumer_overview.cjs
      - run: node tests/audit_runtime/verify_render_queue.cjs
      - run: node tests/audit_runtime/verify_privacy_controls.cjs
      - run: node tests/audit_runtime/verify_local_storage.cjs
      - run: node tests/audit_runtime/verify_render_browser.cjs
      - run: node tests/audit_runtime/verify_network_deadline.cjs
      - run: node tests/audit_runtime/verify_audit_inputs.cjs
      - run: node tests/audit_runtime/verify_resume.cjs
      - run: node tests/audit_runtime/verify_cache.cjs
      - run: node tests/audit_runtime/verify_notifications.cjs
      - run: python tests/audit_runtime/test_bot.py
      - run: python tests/audit_runtime/test_pairing.py
      - run: node verify_dashboard_decision_consistency.js
      - run: node verify_jyotish_product_layer.js
      - run: node verify_fp420_formula_authority.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-runtime-evidence
          path: |
            tests/audit_runtime/*RESULTS.json
            tests/audit_runtime/outage_mobile.png
