name: FP573 button diagnostics
on:
  push:
    branches: [codex/fp573-button-0eca04c]
permissions:
  contents: read
jobs:
  button:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 0eca04cd32030d2a39f4f91573fcae3eaf239c33
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "0eca04cd32030d2a39f4f91573fcae3eaf239c33"
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/public/test_sw_update_coordination.cjs
      - run: |
          for trial in 1 2 3; do node tools/public/verify_css_upgrade.cjs --button || exit 1; done
