name: v18.8 broad structural risk audit

on:
  push:
    branches: [fix/post-freeze-engine-correctness]
    paths:
      - 'audit_v18_8_broad_structural_conflicts.py'
      - 'ENGINE_V19_2_EXPOSED_RULE_ATTRIBUTION.json'
      - 'engine_correctness.py'
      - 'engine_tag_aliases_v1.json'
      - 'engine_scores.json'
      - 'deploy/engine_scores.json'
      - '.github/workflows/v18-8-broad-structural-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run structural audit
        run: python audit_v18_8_broad_structural_conflicts.py
      - name: Verify reproducibility
        run: |
          git diff --exit-code -- ENGINE_V18_8_BROAD_STRUCTURAL_RISK_AUDIT.json
          python - <<'PY'
          import json
          d=json.load(open('ENGINE_V18_8_BROAD_STRUCTURAL_RISK_AUDIT.json',encoding='utf-8'))
          assert d['counts']['broad_p2_p3_sign_flip_rows']==4
          assert d['counts']['rows_with_structural_context']==4
          assert d['counts']['rows_without_structural_context']==0
          print('broad structural audit reproducibility PASS')
          PY
