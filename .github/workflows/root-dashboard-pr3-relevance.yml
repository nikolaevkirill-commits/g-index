name: root dashboard PR3 relevance

on:
  push:
    branches: [fix/post-freeze-engine-correctness]
    paths:
      - 'audit_root_dashboard_pr3_relevance.py'
      - '.github/workflows/root-dashboard-pr3-relevance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python audit_root_dashboard_pr3_relevance.py
