name: Engine correctness tests

on:
  push:
    branches:
      - fix/post-freeze-engine-correctness
    paths:
      - 'engine_correctness.py'
      - 'engine_tag_aliases_v1.json'
      - 'engine_tag_parser.js'
      - 'forecast_engine_v15_1*.py'
      - 'tests/test_engine_correctness.py'
      - 'tests/test_engine_tag_parser.js'
      - '.github/workflows/engine-correctness.yml'
  pull_request:
    paths:
      - 'engine_correctness.py'
      - 'engine_tag_aliases_v1.json'
      - 'engine_tag_parser.js'
      - 'forecast_engine_v15_1*.py'
      - 'tests/test_engine_correctness.py'
      - 'tests/test_engine_tag_parser.js'
      - '.github/workflows/engine-correctness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript alias-parity tests
        run: node tests/test_engine_tag_parser.js
      - name: Forensic search for missing v17/v18.5 sources
        shell: bash
        run: |
          echo '=== ENGINE OBJECT/PATH SEARCH ==='
          git rev-list --objects --all | grep -Ei 'forecast_engine|engine[^ ]*v1[78]|v18[_\. -]?5|v17[_\. -]?0' || true
          echo '=== COMMIT NAME SEARCH ==='
          git log --all --name-only --pretty='format:%H %ad %s' --date=iso | grep -Ei 'forecast_engine|v18[_\. -]?5|v17[_\. -]?0' || true
      - name: Scan all historical Excel blobs for expert verbal tags
        shell: bash
        run: |
          set -euo pipefail
          git rev-list --objects --all | grep -Ei '\.xlsx$' > /tmp/xlsx_objects.txt || true
          echo '=== HISTORICAL XLSX PATHS ==='
          cat /tmp/xlsx_objects.txt || true
          python - <<'PY'
          from zipfile import ZipFile, BadZipFile
          from xml.etree import ElementTree as ET
          import subprocess, tempfile, os, re

          targets=['серце','книги','сукня','таблетка','хрест','гучномовець','зелена печатка','мішень','вінаяка','шприц']
          ns={'m':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
          lines=open('/tmp/xlsx_objects.txt',encoding='utf-8').read().splitlines() if os.path.exists('/tmp/xlsx_objects.txt') else []
          seen=set(); total=0
          print('=== XLSX TAG FORENSICS ===')
          for line in lines:
              parts=line.split(' ',1)
              if len(parts)!=2: continue
              sha,path=parts
              if sha in seen: continue
              seen.add(sha)
              data=subprocess.check_output(['git','cat-file','blob',sha])
              fd,tmp=tempfile.mkstemp(suffix='.xlsx'); os.close(fd)
              open(tmp,'wb').write(data)
              try:
                  with ZipFile(tmp) as z:
                      strings=[]
                      if 'xl/sharedStrings.xml' in z.namelist():
                          root=ET.fromstring(z.read('xl/sharedStrings.xml'))
                          for si in root.findall('m:si',ns):
                              strings.append(''.join(t.text or '' for t in si.iterfind('.//m:t',ns)))
                      # Include inline strings from worksheets too.
                      for name in z.namelist():
                          if name.startswith('xl/worksheets/') and name.endswith('.xml'):
                              root=ET.fromstring(z.read(name))
                              for c in root.findall('.//m:c',ns):
                                  if c.attrib.get('t')=='inlineStr':
                                      strings.append(''.join(t.text or '' for t in c.iterfind('.//m:t',ns)))
                      hits=[]
                      for s in strings:
                          low=s.casefold()
                          found=[t for t in targets if t in low]
                          if found: hits.append((s,found))
                      if hits:
                          total += len(hits)
                          print(f'FILE sha={sha} path={path} hits={len(hits)}')
                          for s,found in hits[:80]:
                              print('  ',repr(s),'->',found)
              except (BadZipFile,ET.ParseError) as e:
                  print(f'WARN {path}: {e}')
              finally:
                  os.unlink(tmp)
          print('ALL_XLSX_TARGET_HITS=',total)
          PY
