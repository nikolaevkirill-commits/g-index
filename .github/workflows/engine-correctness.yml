name: Engine correctness tests

on:
  push:
    branches:
      - fix/post-freeze-engine-correctness
    paths:
      - 'engine_correctness.py'
      - 'engine_tag_aliases_v1.json'
      - 'engine_tag_parser.js'
      - 'forecast_engine_v15_1*.py'
      - 'forecast_engine_v17_0.py'
      - 'forecast_engine_v18_5.py'
      - 'forecast_engine_v18_5_correctness.py'
      - 'score_engine_v19_preview.py'
      - 'sealed_replay_correctness.py'
      - 'sealed_replay_v19_2_reconstructed.py'
      - 'sealed_replay_v19_2_correctness.py'
      - 'tests/test_engine_correctness.py'
      - 'tests/test_v19_2_correctness.py'
      - 'tests/test_v18_5_correctness.py'
      - 'tests/test_engine_tag_parser.js'
      - '.github/workflows/engine-correctness.yml'
  pull_request:
    paths:
      - 'engine_correctness.py'
      - 'engine_tag_aliases_v1.json'
      - 'engine_tag_parser.js'
      - 'forecast_engine_v15_1*.py'
      - 'forecast_engine_v17_0.py'
      - 'forecast_engine_v18_5.py'
      - 'forecast_engine_v18_5_correctness.py'
      - 'score_engine_v19_preview.py'
      - 'sealed_replay_correctness.py'
      - 'sealed_replay_v19_2_reconstructed.py'
      - 'sealed_replay_v19_2_correctness.py'
      - 'tests/test_engine_correctness.py'
      - 'tests/test_v19_2_correctness.py'
      - 'tests/test_v18_5_correctness.py'
      - 'tests/test_engine_tag_parser.js'
      - '.github/workflows/engine-correctness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recovered source provenance
        shell: bash
        run: |
          set -euo pipefail
          echo '1b4c5fa7052590ed441923e9383f42654247711c5ece6f9cea765693a954eaae  forecast_engine_v17_0.py' | sha256sum -c -
          echo '26334307c6d757a183553c4f188c4829db06564a0664dafb1f85f580b3c033c4  forecast_engine_v18_5.py' | sha256sum -c -
          echo '2d3ce185bca12f863a068b95f2a0c84dc2453bbe65fe1dc26855c493a73fb45b  score_engine_v19_preview.py' | sha256sum -c -
      - name: Recovered native engine tests
        shell: bash
        run: |
          set -euo pipefail
          python forecast_engine_v18_5.py --self-test
          python score_engine_v19_preview.py
      - name: Python unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript alias-parity tests
        run: node tests/test_engine_tag_parser.js
      - name: Sealed correctness replay
        run: python sealed_replay_correctness.py
      - name: Reconstructed v19.2 sealed replay
        run: python sealed_replay_v19_2_reconstructed.py
      - name: v19.2 correctness sealed replay
        run: python sealed_replay_v19_2_correctness.py
      - name: Dashboard score-path audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('deploy/index.html')
          text=p.read_text(encoding='utf-8')
          lines=text.splitlines()
          print('=== SCORE PATH AUDIT ===')
          pats={
            'getEngineScore_calls': re.compile(r'\bgetEngineScore\s*\('),
            'direct_engineScores': re.compile(r'_engineScores\s*\['),
            'direct_eng_field': re.compile(r'_engineScores[^\n]{0,160}\.eng\b|_engineScores[^\n]{0,160}\[\s*["\']eng["\']\s*\]'),
          }
          for name,pat in pats.items():
            hits=[]
            for i,line in enumerate(lines,1):
              if pat.search(line): hits.append((i,line.strip()))
            print(f'{name}={len(hits)}')
            for i,line in hits[:120]: print(f'  L{i}: {line[:500]}')
          print('=== DIRECT _engineScores CONTEXT ===')
          for i,line in enumerate(lines,1):
            if '_engineScores[' in line:
              lo=max(1,i-2); hi=min(len(lines),i+2)
              print(f'--- L{i} ---')
              for j in range(lo,hi+1): print(f'{j}: {lines[j-1][:700]}')
          PY
      - name: Historical source provenance audit
        shell: bash
        run: |
          echo '=== ENGINE OBJECT/PATH SEARCH ==='
          git rev-list --objects --all | grep -Ei 'forecast_engine|engine[^ ]*v1[78]|v18[_\. -]?5|v17[_\. -]?0' || true
          echo '=== COMMIT NAME SEARCH ==='
          git log --all --name-only --pretty='format:%H %ad %s' --date=iso | grep -Ei 'forecast_engine|v18[_\. -]?5|v17[_\. -]?0' || true
      - name: Scan historical Excel blobs for expert verbal tags
        shell: bash
        run: |
          set -euo pipefail
          git rev-list --objects --all | grep -Ei '\.xlsx$' > /tmp/xlsx_objects.txt || true
          echo '=== HISTORICAL XLSX PATHS ==='
          cat /tmp/xlsx_objects.txt || true
          python - <<'PY'
          from zipfile import ZipFile, BadZipFile
          import subprocess, tempfile, os
          targets=['серце','книги','сукня','таблетка','хрест','гучномовець','зелена печатка','мішень','вінаяка','шприц']
          lines=open('/tmp/xlsx_objects.txt',encoding='utf-8').read().splitlines() if os.path.exists('/tmp/xlsx_objects.txt') else []
          found=[]
          for line in lines:
            if not line.strip(): continue
            sha,path=line.split(' ',1)
            raw=subprocess.check_output(['git','cat-file','-p',sha])
            fd,tmp=tempfile.mkstemp(suffix='.xlsx'); os.close(fd)
            try:
              open(tmp,'wb').write(raw)
              with ZipFile(tmp) as z:
                texts=[]
                for name in z.namelist():
                  if not name.endswith('.xml'): continue
                  try: data=z.read(name).decode('utf-8','ignore').lower()
                  except Exception: continue
                  for t in targets:
                    if t in data: texts.append((t,name))
                if texts:
                  print('HIT',path,sorted(set(texts)))
                  found.append(path)
            except BadZipFile:
              pass
            finally:
              try: os.unlink(tmp)
              except OSError: pass
          print(f'ALL_XLSX_TARGET_FILES={len(found)}')
          PY
