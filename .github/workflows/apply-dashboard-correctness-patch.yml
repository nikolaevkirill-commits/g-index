name: Apply dashboard correctness patch

on:
  push:
    branches:
      - fix/post-freeze-engine-correctness
    paths:
      - '.github/workflows/apply-dashboard-correctness-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-freeze-engine-correctness
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact audited patch
        run: python patch_dashboard_score_path.py deploy/index.html
      - name: Verify canonical path
        shell: bash
        run: |
          python patch_dashboard_score_path.py --check deploy/index.html
          git diff --check
          git diff -- deploy/index.html
      - name: Commit branch-only dashboard patch
        shell: bash
        run: |
          if git diff --quiet -- deploy/index.html; then
            echo 'No dashboard change required.'
            exit 0
          fi
          git config user.name 'nikolaevkirill-commits'
          git config user.email 'nikolaev.kirill@gmail.com'
          git add deploy/index.html
          git commit -m 'fix(ui): route trend tooltip through canonical Engine score'
          git push origin HEAD:fix/post-freeze-engine-correctness
