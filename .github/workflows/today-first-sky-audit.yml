name: Today all commands audit
on:
  push:
    branches: [codex/today-first-sky-all-a080f0a]
permissions:
  contents: read
  actions: read
concurrency:
  group: cloud-repair-audit-${{ github.run_id }}
  cancel-in-progress: false
jobs:
