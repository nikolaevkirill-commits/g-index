      - if: ${{ !cancelled() && steps.scope.outputs.mode == 'full' }}
        run: node tools/public/verify_offline_cache_budget.cjs
      - if: ${{ !cancelled() && steps.scope.outputs.mode == 'full' }}
        run: node tools/public/verify_b7_activation_race.cjs 1 index.html --multi --offline-reconnect
      - if: ${{ !cancelled() && steps.scope.outputs.mode == 'full' }}
        run: node tools/public/verify_b7_activation_race.cjs 20 classic.html
      - if: ${{ !cancelled() && steps.scope.outputs.mode == 'full' }}
        run: node tools/public/verify_b7_activation_race.cjs 20 index.html
      - if: ${{ !cancelled() && steps.scope.outputs.mode == 'full' }}
