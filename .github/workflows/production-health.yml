name: production health

on:
  push:
    branches: [deploy]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Static production contract
        run: |
          set -euo pipefail
          test -f index.html
          test -f sw.js
          test -f data_manifest.json
          test -f engine_scores.json
          test -f expert_overrides_v3.json
          test -f expert_calc_scores.json
          test -f engine_tag_parser.js
          test -f engine_tag_aliases_v1.json
          test -f privacy.html
          test -f terms.html
          test -f account-deletion.html
          grep -q './engine_tag_parser.js' index.html
          grep -q './engine_tag_aliases_v1.json' index.html
          grep -q 'TOKEN_THEMES' index.html
          grep -q 'getEngineScore(new Date(d.ds' index.html
          grep -q 'gindex_kp_hourly_snapshot_v1' index.html
          grep -q 'МАЙБУТНІЙ ПІК · ПРОГНОЗ' index.html
          grep -q 'ДОБОВЕ ЗВЕДЕННЯ' index.html
          grep -q 'SYNTHETIC FALLBACK · не прогноз NOAA' index.html
          grep -q 'gindex_kp_hourly_last_revision_v1' index.html
          grep -q 'ГЕОМАГНІТНИЙ ФОН ЗАРАЗ · ОКРЕМИЙ ПОКАЗНИК' index.html
          grep -q 'Колір Kp не означає сприятливий день' index.html
          grep -q 'підтримує, але не є дозволом' index.html
          grep -q 'синя лінія = raw-контекст' index.html
          grep -q "new URL('../', window.location.href)" deploy/index.html
          grep -q 'unregister' deploy/sw.js
          node --check engine_tag_parser.js
          node verify_dashboard_decision_consistency.js
          python -m py_compile deploy/run_forecast.py deploy/generate_forecast_pdf.py deploy/generate_bulletin.py
          python verify_production_release_guard.py
      - name: Manifest runtime fingerprints
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('data_manifest.json').read_text(encoding='utf-8'))
          mapping={
            'expert_overrides':'expert_overrides_v3.json',
            'expert_calc':'expert_calc_scores.json',
            'future_kp':'future_kp.json',
            'engine_scores':'engine_scores.json',
          }
          for field,path in mapping.items():
            actual=hashlib.md5(Path(path).read_bytes()).hexdigest().upper()[:12]
            expected=m[field]
            print(field,expected,actual)
            assert expected==actual,(field,expected,actual)
          PY
      - name: Live canonical root
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          expected_title="$(python - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          match=re.search(r'<title>(.*?)</title>',text,re.S)
          assert match, 'dashboard title missing'
          print(match.group(1).strip())
          PY
          )"
          for attempt in $(seq 1 24); do
            curl -fL -H 'Cache-Control: no-cache' --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 40 \
              "https://nikolaevkirill-commits.github.io/g-index/?health_sha=${GITHUB_SHA}&attempt=${attempt}" \
              -o /tmp/root.html
            if grep -q 'engine_tag_parser.js' /tmp/root.html && \
               grep -q 'TOKEN_THEMES' /tmp/root.html && \
               grep -Fq "$expected_title" /tmp/root.html; then
              echo "Live canonical root PASS on attempt ${attempt}."
              break
            fi
            echo "GitHub Pages has not published the canonical root yet (attempt ${attempt}/24)."
            if [ "$attempt" -eq 24 ]; then
              echo 'Live canonical root did not converge within four minutes.' >&2
              exit 1
            fi
            sleep 10
          done
          for page in privacy.html terms.html account-deletion.html; do
            curl -fL -H 'Cache-Control: no-cache' --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 40 \
              "https://nikolaevkirill-commits.github.io/g-index/${page}?health_sha=${GITHUB_SHA}" \
              -o "/tmp/${page}"
          done
          grep -q 'Політика конфіденційності G-Index' /tmp/privacy.html
          grep -q 'Умови використання G-Index' /tmp/terms.html
          grep -q 'Видалення акаунта G-Index' /tmp/account-deletion.html
      - name: Live deprecated nested compatibility
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 40 \
            https://nikolaevkirill-commits.github.io/g-index/deploy/ -o /tmp/nested.html
          grep -q "new URL('../', window.location.href)" /tmp/nested.html
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 40 \
            https://nikolaevkirill-commits.github.io/g-index/deploy/sw.js -o /tmp/nested-sw.js
          grep -q 'unregister' /tmp/nested-sw.js
          grep -q "new URL('../', event.request.url)" /tmp/nested-sw.js
      - name: Production workflow security contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=sorted(Path('.github/workflows').glob('*.yml'))
          for p in files:
              text=p.read_text(encoding='utf-8')
              if p.name=='production-health.yml':
                  text=re.sub(r"\n      - name: Production workflow security contract\n.*?(?=\n      - name: Protected artifact hashes)","",text,flags=re.S)
              bad_perm=re.findall(r'(?m)^\s*(contents|actions|pull-requests):\s*write\s*$',text)
              assert not bad_perm,(p,bad_perm)
              bad_cmd=re.findall(r'(?m)^\s*(?:git\s+add\s+(?:\.|-A|--all)|git\s+push\b|git\s+commit\b)',text)
              assert not bad_cmd,(p,bad_cmd)
              print('SECURITY PASS',p.name)
          PY
      - name: Protected artifact hashes
        run: |
          sha256sum engine_scores.json expert_overrides_v3.json expert_calc_scores.json future_kp.json
