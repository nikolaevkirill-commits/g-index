name: production health

on:
  push:
    branches: [deploy]
  pull_request:
    paths: ['.github/workflows/production-health.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Static production contract
        run: |
          set -euo pipefail
          test -f index.html
          test -f sw.js
          test -f data_manifest.json
          test -f engine_scores.json
          test -f expert_overrides_v3.json
          test -f expert_calc_scores.json
          test -f engine_tag_parser.js
          test -f engine_tag_aliases_v1.json
          grep -q './engine_tag_parser.js' index.html
          grep -q './engine_tag_aliases_v1.json' index.html
          grep -q 'TOKEN_THEMES' index.html
          grep -q 'getEngineScore(new Date(d.ds' index.html
          grep -q "new URL('../', window.location.href)" deploy/index.html
          grep -q 'unregister' deploy/sw.js
          node --check engine_tag_parser.js
          python -m py_compile deploy/run_forecast.py deploy/generate_forecast_pdf.py deploy/generate_bulletin.py
      - name: Manifest runtime fingerprints
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('data_manifest.json').read_text(encoding='utf-8'))
          mapping={
            'expert_overrides':'expert_overrides_v3.json',
            'expert_calc':'expert_calc_scores.json',
            'future_kp':'future_kp.json',
            'engine_scores':'engine_scores.json',
          }
          for field,path in mapping.items():
            actual=hashlib.md5(Path(path).read_bytes()).hexdigest().upper()[:12]
            expected=m[field]
            print(field,expected,actual)
            assert expected==actual,(field,expected,actual)
          PY
      - name: Live canonical root
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 40 \
            https://nikolaevkirill-commits.github.io/g-index/ -o /tmp/root.html
          grep -q 'engine_tag_parser.js' /tmp/root.html
          grep -q 'TOKEN_THEMES' /tmp/root.html
      - name: Live deprecated nested compatibility
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 40 \
            https://nikolaevkirill-commits.github.io/g-index/deploy/ -o /tmp/nested.html
          grep -q "new URL('../', window.location.href)" /tmp/nested.html
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 40 \
            https://nikolaevkirill-commits.github.io/g-index/deploy/sw.js -o /tmp/nested-sw.js
          grep -q 'unregister' /tmp/nested-sw.js
          grep -q "new URL('../', event.request.url)" /tmp/nested-sw.js
      - name: Production workflow security contract
        run: |
          set -euo pipefail
          ! grep -R -nE 'contents:[[:space:]]*write|actions:[[:space:]]*write|pull-requests:[[:space:]]*write' .github/workflows
          ! grep -R -nE 'git add ([.]|-A|--all)|git push|git commit' .github/workflows
      - name: Protected artifact hashes
        run: |
          sha256sum engine_scores.json expert_overrides_v3.json expert_calc_scores.json future_kp.json
