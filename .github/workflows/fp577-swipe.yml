name: FP577 tablet reflow
on:
  push:
    branches: [codex/fp577-swipe-66a58f1]
permissions:
  contents: read
jobs:
  reflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 66a58f1b691603be2c9898903e5a0664f7263cb3
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "66a58f1b691603be2c9898903e5a0664f7263cb3"
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: |
          echo  | base64 -d > "$RUNNER_TEMP/swipe.cjs"
          NODE_PATH="$PWD/node_modules" node "$RUNNER_TEMP/swipe.cjs" "$PWD" "$RUNNER_TEMP/swipe.json"
          node -e "const rows=require(process.argv[1]);require('assert/strict').equal(rows.length,3);for(const r of rows){console.log(JSON.stringify({rep:r.rep,opening:r.opening,swipes:r.steps.length-1,visible:r.visible,beforeTap:r.beforeTap,after:r.after,events:r.events}));if(!r.visible?.hit||!r.beforeTap.hit||r.beforeTap.off===r.after.off||!['pointerdown','click'].every(e=>r.events.some(a=>a[0]===e&&a[1]&&a[2])))process.exitCode=1}" "$RUNNER_TEMP/swipe.json"
