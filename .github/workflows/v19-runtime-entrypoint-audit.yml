name: v19 runtime entrypoint audit

on:
  push:
    branches: [fix/post-freeze-engine-correctness]
    paths:
      - 'audit_v19_runtime_entrypoints.py'
      - 'deploy/run_forecast.py'
      - 'deploy/generate_forecast_pdf.py'
      - 'deploy/score_engine_v19_preview.py'
      - 'deploy/panchanga_sign_priors.json'
      - 'deploy/calendar_tags_2025_2026.json'
      - '.github/workflows/v19-runtime-entrypoint-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependency
        run: pip install openpyxl
      - name: Audit entrypoints and default CLI
        run: python audit_v19_runtime_entrypoints.py
