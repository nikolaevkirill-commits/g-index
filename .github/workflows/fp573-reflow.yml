name: FP573 reflow diagnostics
on:
  push:
    branches: [codex/fp573-reflow-3cfebfe]
permissions:
  contents: read
jobs:
  reflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 3cfebfe7960ff93fa51574dcb320b566f2792605
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "3cfebfe7960ff93fa51574dcb320b566f2792605"
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/public/verify_all_routes_reflow.cjs . "$RUNNER_TEMP/reflow.json"
