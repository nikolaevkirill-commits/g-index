name: v19.2 exposed rule attribution

on:
  push:
    branches: [fix/post-freeze-engine-correctness]
    paths:
      - 'audit_v19_2_rule_attribution.py'
      - 'ENGINE_V19_2_PRODUCTION_HIERARCHY_IMPACT.json'
      - 'engine_scores_v19_2_candidate.json'
      - 'engine_scores.json'
      - 'sealed_replay_v19_2_reconstructed.py'
      - '.github/workflows/v19-2-rule-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Attribute exposed changes
        run: python audit_v19_2_rule_attribution.py
      - name: Verify committed frozen attribution is reproducible
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- ENGINE_V19_2_EXPOSED_RULE_ATTRIBUTION.json
          python - <<'PY'
          import json
          d=json.load(open('ENGINE_V19_2_EXPOSED_RULE_ATTRIBUTION.json',encoding='utf-8'))
          assert d['counts']['rows']==29
          assert d['counts']['sign_flips']==12
          assert d['counts']['v19_1_prior_vs_med_conflict_rows']==0
          print('rule-attribution reproducibility PASS')
          PY
