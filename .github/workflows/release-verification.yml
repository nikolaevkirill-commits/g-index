name: verify published release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip superseded deployments
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/${{ github.repository }}/git/ref/heads/deploy --jq .object.sha)
          if [ "$latest" = "$(git rev-parse HEAD)" ]; then
            echo "verify=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer deployment supersedes this run; its own verification must pass."
            echo "verify=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.current.outputs.verify == 'true'
        with: {python-version: '3.12'}
      - name: Verify actual published runtime and decisions
        if: steps.current.outputs.verify == 'true'
        run: python tools/public/verify_release_publication.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.current.outputs.verify == 'true'
        with:
          name: release-publication
          path: release-publication.json
          retention-days: 14
