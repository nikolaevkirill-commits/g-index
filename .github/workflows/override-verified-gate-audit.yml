name: override verified gate audit

on:
  push:
    branches: [fix/post-freeze-engine-correctness]
    paths:
      - 'audit_override_verified_gate.py'
      - '.github/workflows/override-verified-gate-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python audit_override_verified_gate.py
